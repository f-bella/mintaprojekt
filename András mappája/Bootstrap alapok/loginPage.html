<meta charset="UTF-8">

<script src="./vendor/bootstrap-5.0.2-dist/js/bootstrap.bundle.js"></script>
<link href="./vendor/bootstrap-5.0.2-dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<link href="./vendor/fontawesome-free-6.5.1-web/css/all.css" rel="stylesheet">

<body class="bg-dark">

    <div class="container-fluid d-flex justify-content-center mt-5">

            <div class="bg-light col-10 col-lg-3 p-3 rounded mt-5 ">
                <div class="h4 text-center">
                    Bejelentkezés
                </div>
                <div class="p-4 pb-0">
                    <input class="form-control userInput" placeholder="Felhasználónév...">
                </div>
                <div class="p-4 pb-0">
                    <input type="password" class="form-control pwInput" placeholder="Jelszó...">
                </div>
                <div class="p-4 text-center">
                    <button class="btn btn-dark loginBtn">Belép</button>
                </div>
                <div class="errorMsg text-danger text-center h5"></div>
            </div>
      
    </div>


</body>

<script>

    const user = [
        {userName:"Béla", passWord:"Admin"},
        {userName:"Ottó", passWord:"Haha"},
    ]


    const ErTypes = {
        noUser:"Nincs felhasználónév.",
        noPw:"Nincs Jelszó.",
        wrongPw:"Hibás felhasználónév, vagy jelszó."
    }


    const loginBtn = document.querySelector(".loginBtn")
    const userInput = document.querySelector(".userInput")
    const pwInput = document.querySelector(".pwInput")
    const errorMsg = document.querySelector(".errorMsg")


    const validator = () =>{
        let errors = ""

        if(userInput.value == ""){
            errors += `<div>${ErTypes.noUser}</div>`
        }
        if(pwInput.value == ""){
            errors += `<div>${ErTypes.noPw}</div>`
        }

        if(errors == ""){
            const result = user.filter(usr_=>{
                    return usr_.userName == userInput.value && usr_.passWord == pwInput.value
                })
                console.log(result)
            if(result.length == 0){
                errors += `<div>${ErTypes.wrongPw}</div>`
            }
            else{
                errors = ""
            }
        }

        errorMsg.innerHTML = errors
        if(errors == ""){
           location.href = "https://www.google.com"
        }
        
    }




    loginBtn.addEventListener("click",()=>{
        validator()
    })

    userInput.addEventListener("keyup",(event)=>{
        if(event.keyCode == 13){    //ENTER leütés
            validator()
        }
    })

    pwInput.addEventListener("keyup",(event)=>{
        if(event.keyCode == 13){    //ENTER leütés
            validator()
        }
    })
</script>
